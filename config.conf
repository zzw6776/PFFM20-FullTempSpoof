#!/system/bin/sh
# ==============================================================================
# PFFM20 Full Temperature Spoof 配置文件
# ==============================================================================
#
# 修改方法：
#   1. 只修改等号右侧的值，不要在等号两侧加入空格。
#   2. 开关统一使用 1（开启）或 0（关闭）。
#   3. 温度统一填写摄氏度整数；程序会自动换算为 thermal sysfs 使用的毫摄氏度。
#   4. 修改完成后重启，或在 Magisk 模块页面点击“执行/Action”重新应用。
#
# 设计边界：
#   - 本模块不持续轮询温度，不包含温度 watchdog。
#   - 本模块不修改 XML、thermal.conf、Power HAL、CPU 频率或 cooling device。
#   - 对外可以伪装 soc_max，但不会修改 thermal_zone0 的 mode、trip point、
#     emul_temp 或内核内部温度，因此 116.5°C critical 保护仍由内核处理。
#   - bind mount 只改变用户空间从路径读取到的内容，不改变内核内部热管理数据。
# ==============================================================================

# ------------------------------ 总开关 ----------------------------------------
# 1：开机应用配置；0：不应用，并尝试恢复本模块创建的运行时挂载。
MASTER_ENABLE=1

# 1：严格限制为本机 PFFM20 / MT6983 / Android 12 / 5.10.66 内核。
# 不建议关闭；关闭后在其他设备运行可能造成严重异常。
STRICT_DEVICE_CHECK=1
EXPECTED_MODEL=PFFM20
EXPECTED_PLATFORM=mt6983
EXPECTED_ANDROID=12
EXPECTED_KERNEL_PREFIX=5.10.66

# 等待 thermal zone 出现的最长秒数。PFFM20 正常应检测到 51 个。
WAIT_TIMEOUT_SEC=120
EXPECTED_MIN_THERMAL_ZONES=51

# --------------------------- CPU 温度分类 -------------------------------------
# 本机实测类型：cpu_big1～cpu_big6、cpu_bigbig1～cpu_bigbig2、
# cpu_little1～cpu_little4，共 12 个。
CPU_ENABLE=1
CPU_TEMP_C=40

# --------------------------- GPU 温度分类 -------------------------------------
# 本机实测类型：gpu1、gpu2，共 2 个。
GPU_ENABLE=1
GPU_TEMP_C=40

# ------------------------- APU / NPU 分类 -------------------------------------
# 本机实测类型：apu1～apu4，共 4 个；规则同时预留 npu*。
APU_NPU_ENABLE=1
APU_NPU_TEMP_C=40

# --------------------------- 内存温度分类 -------------------------------------
# 本机实测类型：dram_ch0～dram_ch3，共 4 个。
MEMORY_ENABLE=1
MEMORY_TEMP_C=40

# ----------------------------- SoC 分类 ---------------------------------------
# 本机实测类型：soc_max、soc_top、soc_mm，共 3 个。
# 注意：这里只伪装用户空间读取值；不会修改 soc_max 内核 critical 保护。
SOC_ENABLE=1
SOC_TEMP_C=40

# --------------------------- 外壳 / SKIN 分类 ---------------------------------
# 本机实测类型：shell_front、shell_frame、shell_back，共 3 个。
SHELL_SKIN_ENABLE=1
SHELL_SKIN_TEMP_C=36

# ----------------------------- 电池分类 ---------------------------------------
# 本机实测类型：battery、mtk-battery，共 2 个。
BATTERY_ENABLE=1
BATTERY_TEMP_C=30

# ----------------------------- 充电器分类 -------------------------------------
# 本机实测类型：mtk-master-charger、mtk-slave-charger、
# mtk-mst-div-charger、mtk-slv-div-charger，共 4 个。
CHARGER_ENABLE=1
CHARGER_TEMP_C=35

# ------------------------------ PMIC 分类 -------------------------------------
# 本机实测类型：pmic6363_* 4 个、pmic6373_* 4 个、pmic6338_ts，
# 共 9 个。
PMIC_ENABLE=1
PMIC_TEMP_C=40

# --------------------------- Modem / RF 分类 ----------------------------------
# 本机实测类型：md1～md3、ltepa_ntc、nrpa_ntc，共 5 个。
# 关闭该分类可降低基带异常风险。
MODEM_RF_ENABLE=1
MODEM_RF_TEMP_C=40

# ---------------------------- 连接子系统分类 ----------------------------------
# 本机实测类型：consys，共 1 个。
CONNECTIVITY_ENABLE=1
CONNECTIVITY_TEMP_C=40

# ------------------------- NTC / 环境温度分类 ---------------------------------
# 本机实测类型：ap_ntc、quiet_ntc，共 2 个。
NTC_AMBIENT_ENABLE=1
NTC_AMBIENT_TEMP_C=36

# ---------------------------- 未识别温区 --------------------------------------
# 所有未命中上述规则的 thermal zone 都进入 UNKNOWN。
# 当前实测的 51 个温区均能命中已知分类，UNKNOWN 是未来变化的兜底。
# 默认开启意味着新增或未识别 thermal zone 也会尝试伪装。
UNKNOWN_ENABLE=1
UNKNOWN_TEMP_C=40

# --------------------------- 额外温度入口 -------------------------------------
# 伪装 /sys/class/power_supply/battery/temp。
# 该节点单位是 0.1°C，程序会自动把 30°C 写成 300。
POWER_SUPPLY_BATTERY_ENABLE=1

# 通过 ColorOS 的 /proc/shell-temp 写入协议设置 0～7 号外壳传感器温度。
# 关闭模块时会向 0～7 号写入 0，表示撤销该接口的固定温度。
PROC_SHELL_TEMP_ENABLE=1

# ------------------------- 厂商私有温控服务 -----------------------------------
# Horae 已确认会绕过 thermal sysfs 读取真实外壳温度。
# stop：启动时停止；keep：保持系统原样。
HORAE_MODE=stop

# MTK Vendor Thermal HAL 也已确认能绕过已伪装的 CPU/shell sysfs。
# restart：挂载后重启，让服务重新读取节点（默认）；stop：停止；keep：保持原样。
VENDOR_THERMAL_HAL_MODE=restart

# thermal_core 是联发科私有温度后端，停止后的系统影响尚未完全验证。
# 默认 keep；如仍确认存在私有温控动作，可手动改为 stop 后测试。
THERMAL_CORE_MODE=keep

# ----------------------------- 冲突检测 ---------------------------------------
# 1：发现 AaTempSpoof 或旧 ColorOS 去温控模块处于启用状态时拒绝运行。
# 两个模块同时操作同一温度节点会产生叠加挂载和恢复错误，建议保持开启。
CONFLICT_CHECK=1

# ------------------------------- 验证 -----------------------------------------
# 1：应用后读取每个节点并记录映射结果。
# 默认开启。
VERIFY_AFTER_APPLY=1

# ----------------------------- 无线调试 ---------------------------------------
# 1：脚本设置指定端口并重启 adbd；0：删除该运行时端口并重启 adbd。
# MASTER_ENABLE=0 或卸载模块时同样会关闭；不读取或恢复脚本执行前的端口值。
ADB_WIFI_ENABLE=1
# 自定义无线调试端口（默认 5555，建议修改为其他 1024～65535 之间的端口以防被扫描）
ADB_WIFI_PORT=35555
