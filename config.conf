#!/system/bin/sh
# ==============================================================================
# ColorOS Full Temperature Spoof 配置文件
# ==============================================================================
#
# 修改方法：
#   1. 只修改等号右侧的值，不要在等号两侧加入空格。
#   2. 开关统一使用 1（开启）或 0（关闭）。
#   3. 温度统一填写摄氏度整数；程序会自动换算为 thermal sysfs 使用的毫摄氏度。
#   4. 修改完成后重启，或在 Magisk 模块页面点击“执行/Action”重新应用。
#
# 设计边界：
#   - 本模块不持续轮询温度，不包含温度 watchdog。
#   - 本模块不修改 XML、thermal.conf、Power HAL、CPU 频率或 cooling device。
#   - 对外可以伪装 soc_max，但不会修改 thermal_zone0 的 mode、trip point、
#     emul_temp 或内核内部温度，因此 116.5°C critical 保护仍由内核处理。
#   - bind mount 只改变用户空间从路径读取到的内容，不改变内核内部热管理数据。
# ==============================================================================

# ------------------------------ 总开关 ----------------------------------------
# 1：开机应用配置；0：不应用，并尝试恢复本模块创建的运行时挂载。
MASTER_ENABLE=1

# 本版本不在启动时校验机型、Android 版本或内核版本。
# 等待 thermal zone 至少出现 1 个的最长秒数；发现几个就动态处理几个。
WAIT_TIMEOUT_SEC=120

# 只伪装当前值看起来像正常温度的 thermal zone / power_supply 温度节点。
# 10000=10°C，130000=130°C；用于跳过 0、vbat=3922、socd=50、-273000 等非正常温度值。
# thermal_zone 按毫摄氏度判断；power_supply 会按常见 0.1°C 或摄氏度节点自动换算判断。
THERMAL_VALUE_FILTER_ENABLE=1
THERMAL_VALID_MIN_MILLI_C=10000
THERMAL_VALID_MAX_MILLI_C=130000

# --------------------------- CPU 温度分类 -------------------------------------
# 本机实测类型：cpu_big1～cpu_big6、cpu_bigbig1～cpu_bigbig2、
# cpu_little1～cpu_little4，共 12 个。
CPU_ENABLE=1
CPU_TEMP_C=30

# --------------------------- GPU 温度分类 -------------------------------------
# 本机实测类型：gpu1、gpu2，共 2 个。
GPU_ENABLE=1
GPU_TEMP_C=30

# ------------------------- APU / NPU 分类 -------------------------------------
# 本机实测类型：apu1～apu4，共 4 个；规则同时预留 npu*。
APU_NPU_ENABLE=1
APU_NPU_TEMP_C=30

# --------------------------- 内存温度分类 -------------------------------------
# 本机实测类型：dram_ch0～dram_ch3，共 4 个。
MEMORY_ENABLE=1
MEMORY_TEMP_C=30

# ----------------------------- SoC 分类 ---------------------------------------
# 本机实测类型：soc_max、soc_top、soc_mm，共 3 个。
# 注意：这里只伪装用户空间读取值；不会修改 soc_max 内核 critical 保护。
SOC_ENABLE=1
SOC_TEMP_C=30

# --------------------------- 外壳 / SKIN 分类 ---------------------------------
# 本机实测类型：shell_front、shell_frame、shell_back，共 3 个。
SHELL_SKIN_ENABLE=1
SHELL_SKIN_TEMP_C=30

# ----------------------------- 电池分类 ---------------------------------------
# 本机实测类型：battery、mtk-battery，共 2 个。
BATTERY_ENABLE=1
BATTERY_TEMP_C=30

# ----------------------------- 充电器分类 -------------------------------------
# 本机实测类型：mtk-master-charger、mtk-slave-charger、
# mtk-mst-div-charger、mtk-slv-div-charger，共 4 个。
CHARGER_ENABLE=1
CHARGER_TEMP_C=30

# ------------------------------ PMIC 分类 -------------------------------------
# 本机实测类型：pmic6363_* 4 个、pmic6373_* 4 个、pmic6338_ts，
# 共 9 个。
PMIC_ENABLE=1
PMIC_TEMP_C=30

# --------------------------- Modem / RF 分类 ----------------------------------
# 本机实测类型：md1～md3、ltepa_ntc、nrpa_ntc，共 5 个。
# 关闭该分类可降低基带异常风险。
MODEM_RF_ENABLE=1
MODEM_RF_TEMP_C=30

# ---------------------------- 连接子系统分类 ----------------------------------
# 本机实测类型：consys，共 1 个。
CONNECTIVITY_ENABLE=1
CONNECTIVITY_TEMP_C=30

# ------------------------- NTC / 环境温度分类 ---------------------------------
# 本机实测类型：ap_ntc、quiet_ntc，共 2 个。
NTC_AMBIENT_ENABLE=1
NTC_AMBIENT_TEMP_C=30

# ---------------------------- 未识别温区 --------------------------------------
# 所有未命中上述规则的 thermal zone 都进入 UNKNOWN。
# 当前实测的 51 个温区均能命中已知分类，UNKNOWN 是未来变化的兜底。
# 默认开启意味着新增或未识别 thermal zone 也会尝试伪装。
UNKNOWN_ENABLE=1
UNKNOWN_TEMP_C=30

# --------------------------- 额外温度入口 -------------------------------------
# 动态伪装 /sys/class/power_supply/*/temp 与 */temperature 中的电池/电量计节点。
# 常见 temp 节点单位是 0.1°C，程序会自动把 30°C 写成 300；
# mtk-battery/temperature 按摄氏度写入。
POWER_SUPPLY_BATTERY_ENABLE=1

# 通过 ColorOS 的 /proc/shell-temp 写入协议设置 0～7 号外壳传感器温度。
# 关闭模块时会向 0～7 号写入 0，表示撤销该接口的固定温度。
PROC_SHELL_TEMP_ENABLE=1

# ------------------------- 厂商私有温控服务 -----------------------------------
# 每个服务单独配置，默认全部为 keep，也就是“不停止、不重启、不改服务状态”。
#
# 可选值：
#   keep：默认值，不处理该服务。最安全，跨机型推荐保持此值。
#   stop：只尝试停止该服务；如果厂商框架依赖它，可能引发温控异常、显示服务崩溃或重启。
#   restart：只尝试重启该服务；适合确认该服务可安全重启后再使用。
#   stop_then_restart：先 stop；如果 stop 失败再 restart。风险最高，不建议默认使用。
#
# 注意：
#   1. 这些服务名在不同 SoC、系统版本和厂商 ROM 上可能不存在；不存在时脚本会跳过。
#   2. keep 不影响 thermal zone / power_supply / /proc/shell-temp 的温度伪装功能。
#   3. 如果某台设备必须刷新厂商温控服务才能读到伪装值，只改对应那一个服务即可。
#   4. OnePlus / Qualcomm 机型上 vendor.thermal-hal 与显示、功耗、温控链路耦合较深，
#      stop/restart 可能诱发系统服务崩溃或重启，默认必须保持 keep。

# ColorOS / OPPO / OnePlus 常见 Horae 温控调度服务。
# 配置为 stop 或 stop_then_restart 时，脚本还会尝试把 persist.sys.horae.enable 置为 0；
# 配置为 keep 或 restart 时，不会改这个属性。
HORAE_SERVICE_MODE=keep

# MediaTek 老式 Thermal HAL 服务，常见于 MTK 平台。
MTK_THERMAL_HAL_SERVICE_MODE=keep

# MediaTek thermal_core 服务，常见于部分 MTK 平台。
THERMAL_CORE_SERVICE_MODE=keep

# Qualcomm thermal-engine 服务。
THERMAL_ENGINE_SERVICE_MODE=keep

# Qualcomm qti.thermal-engine 服务，部分 ROM 使用这个服务名。
QTI_THERMAL_ENGINE_SERVICE_MODE=keep

# Qualcomm / vendor Thermal HAL 服务。高风险项：不确认兼容前建议保持 keep。
VENDOR_THERMAL_HAL_SERVICE_MODE=keep

# AIDL 形式的 vendor Thermal HAL 服务，部分新系统可能使用。
VENDOR_THERMAL_HAL_AIDL_SERVICE_MODE=keep

# HIDL 2.0 形式的 vendor Thermal HAL 服务，部分系统可能使用。
VENDOR_THERMAL_HAL_2_0_SERVICE_MODE=keep

# ----------------------------- 冲突检测 ---------------------------------------
# 1：发现 AaTempSpoof 或旧 ColorOS 去温控模块处于启用状态时拒绝运行。
# 两个模块同时操作同一温度节点会产生叠加挂载和恢复错误，建议保持开启。
CONFLICT_CHECK=1

# ------------------------------- 验证 -----------------------------------------
# 1：应用后读取每个节点并记录映射结果。
# 默认开启。
VERIFY_AFTER_APPLY=1

# ----------------------------- 无线调试 ---------------------------------------
# 1：脚本设置指定端口并重启 adbd；0：删除该运行时端口并重启 adbd。
# MASTER_ENABLE=0 或卸载模块时同样会关闭；不读取或恢复脚本执行前的端口值。
ADB_WIFI_ENABLE=0
# 自定义无线调试端口（默认 5555，建议修改为其他 1024～65535 之间的端口以防被扫描）
ADB_WIFI_PORT=35555
# 延迟处理无线调试的秒数。
# 部分 ColorOS 设备开机早期 adbd 尚未就绪，过早重启会导致端口属性已设置但没有监听。
# 0：不延迟；建议 10，仍偶发失败可改为 30 或 60。
ADB_WIFI_DELAY_SEC=10
